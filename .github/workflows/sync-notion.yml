name: Sync Notion Knowledge

on:
  repository_dispatch:
    types:
      - notion_knowledge_changed

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show dispatch payload
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          echo "Received Notion event:"
          echo "$PAYLOAD"

      - name: Test
        run: |
          echo "Notion → GitHub pipeline is alive."
